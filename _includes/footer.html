<footer class="footer border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>


<script>
(function () {

  function setActive(btn) {
    document.querySelectorAll(".pub-filter-btn").forEach(function (b) {
      b.classList.remove("active");
    });
    btn.classList.add("active");
  }

  function applyFilter(filter) {
    document.querySelectorAll(".pub-entry").forEach(function (item) {
      var t = (item.dataset.pubType || "").toLowerCase();
      if (filter === "all" || t === filter) {
        item.style.display = "";
      } else {
        item.style.display = "none";
      }
    });
  }

  document.querySelectorAll(".pub-filter-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var filter = btn.dataset.filter;
      setActive(btn);
      applyFilter(filter);
    });
  });

  applyFilter("all");

})();
</script>
